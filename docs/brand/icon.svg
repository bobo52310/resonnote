<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Vector twin of icon-1024.png (designed with Codex): 「●」 corner brackets = viewfinder
       corners + Chinese quote marks; red dot = this moment. Colours sampled from the raster. -->
