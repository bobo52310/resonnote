      <stop offset="0" stop-color="#3a3125"/>
      <stop offset="1" stop-color="#17120d"/>
    </linearGradient>
    <linearGradient id="amber" gradientUnits="userSpaceOnUse" x1="28" y1="20" x2="100" y2="108">
      <stop offset="0" stop-color="#ffc657"/>
      <stop offset="1" stop-color="#ffa31c"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.5" cy="0.5" r="0.5" fx="0.36" fy="0.32">
