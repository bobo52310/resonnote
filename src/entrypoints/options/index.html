<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>scenenote 筆記本</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f6f6f4, #17181a);
        --surface: light-dark(#ffffff, #212326);
        --text: light-dark(#1d1f21, #e8e9ea);
        --muted: light-dark(#5f6368, #a4a8ad);
        --border: light-dark(#d9dadc, #3a3d41);
        --accent: light-dark(#b3141c, #ff6b73);
        --accent-bg: light-dark(#fdeaea, #3b1d1f);
        --warn-bg: light-dark(#fff3cd, #4a3b0c);
        --warn-border: light-dark(#d4a017, #c9a227);
        --placeholder: light-dark(#e1e2e4, #33363a);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 1.6rem;
      }
      h2 {
        margin: 0;
        font-size: 1.15rem;
      }
      button {
        font: inherit;
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--muted);
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .backup-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }
      .backup-bar.reminder {
        border-color: var(--warn-border);
        background: var(--warn-bg);
      }
      .backup-status {
        margin-right: auto;
        font-weight: 600;
      }
      .backup-hint {
        color: var(--accent);
        font-weight: 600;
      }
      .status {
        min-height: 1.6em;
        margin: 8px 0;
        color: var(--muted);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 24px;
      }
      .empty {
        padding: 48px 16px;
        text-align: center;
        color: var(--muted);
      }
      .group {
        margin-bottom: 32px;
      }
      .group-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-bottom: 8px;
        margin-bottom: 12px;
        border-bottom: 2px solid var(--border);
      }
      .group-select {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        cursor: pointer;
      }
      .note {
        display: grid;
        grid-template-columns: auto 200px 1fr;
        gap: 12px;
        align-items: start;
        padding: 12px;
        margin-bottom: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }
      .note input[type='checkbox'],
      .group-select input {
        width: 18px;
        height: 18px;
        margin: 2px 0 0;
      }
      .thumb {
        aspect-ratio: 16 / 9;
        border-radius: 6px;
        overflow: hidden;
        background: var(--placeholder);
      }
      .thumb img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .thumb-empty {
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .note-main {
        display: grid;
        gap: 8px;
        min-width: 0;
      }
      .time {
        justify-self: start;
        padding: 2px 10px;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        color: var(--accent);
        background: var(--accent-bg);
        border-color: transparent;
      }
      .subtitle {
        margin: 0;
        padding-left: 12px;
        border-left: 3px solid var(--border);
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      textarea {
        width: 100%;
        min-height: 4.5em;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
        resize: vertical;
      }
      .note-actions {
        display: flex;
        justify-content: flex-end;
      }
      .delete {
        color: var(--muted);
      }
      .delete.confirming {
        color: #fff;
        background: #b3141c;
        border-color: #b3141c;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      @media (max-width: 640px) {
        .note {
          grid-template-columns: auto 1fr;
        }
        .note-main {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>scenenote 筆記本</h1>
      <div id="notebook"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
